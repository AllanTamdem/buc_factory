<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title>Business use case factory architecture</title>
<desc>A diagram showing how a domain configuration flows through an autonomous agent loop to produce three recruitment assessment deliverables.</desc>

<style>
  .t  { font-size: 14px; font-weight: 400; fill: #2C2C2A; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .gray-fill   { fill: #F1EFE8; stroke: #5F5E5A; }
  .gray-text   { fill: #2C2C2A; }
  .gray-sub    { fill: #5F5E5A; }
  .purple-outer{ fill: #EEEDFE; stroke: #534AB7; }
  .purple-step { fill: #AFA9EC; stroke: #534AB7; }
  .purple-text { fill: #26215C; }
  .purple-sub  { fill: #3C3489; }
  .teal-fill   { fill: #E1F5EE; stroke: #0F6E56; }
  .teal-text   { fill: #04342C; }
  .teal-sub    { fill: #0F6E56; }
  @media (prefers-color-scheme: dark) {
    .t, .th { fill: #F1EFE8; }
    .ts { fill: #B4B2A9; }
    .gray-fill   { fill: #444441; stroke: #B4B2A9; }
    .gray-text   { fill: #F1EFE8; }
    .gray-sub    { fill: #D3D1C7; }
    .purple-outer{ fill: #3C3489; stroke: #AFA9EC; }
    .purple-step { fill: #534AB7; stroke: #AFA9EC; }
    .purple-text { fill: #EEEDFE; }
    .purple-sub  { fill: #CECBF6; }
    .teal-fill   { fill: #085041; stroke: #5DCAA5; }
    .teal-text   { fill: #E1F5EE; }
    .teal-sub    { fill: #9FE1CB; }
  }
</style>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="ts" x="340" y="32" text-anchor="middle">Inputs · domain config (YAML for CLI, JSON for API)</text>

<rect class="gray-fill" x="40" y="50" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="th gray-text" x="110" y="74" text-anchor="middle" dominant-baseline="central">Industry</text>
<text class="ts gray-sub" x="110" y="92" text-anchor="middle" dominant-baseline="central">Any vertical</text>

<rect class="gray-fill" x="200" y="50" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="th gray-text" x="270" y="74" text-anchor="middle" dominant-baseline="central">Tool</text>
<text class="ts gray-sub" x="270" y="92" text-anchor="middle" dominant-baseline="central">Power BI · Python · SQL</text>

<rect class="gray-fill" x="360" y="50" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="th gray-text" x="430" y="74" text-anchor="middle" dominant-baseline="central">Profile</text>
<text class="ts gray-sub" x="430" y="92" text-anchor="middle" dominant-baseline="central">Analyst · DS · BI · DE</text>

<rect class="gray-fill" x="520" y="50" width="120" height="56" rx="8" stroke-width="0.5"/>
<text class="th gray-text" x="580" y="74" text-anchor="middle" dominant-baseline="central">Language</text>
<text class="ts gray-sub" x="580" y="92" text-anchor="middle" dominant-baseline="central">FR, EN, ES</text>

<line x1="110" y1="106" x2="200" y2="160" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="270" y1="106" x2="280" y2="160" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="430" y1="106" x2="400" y2="160" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="580" y1="106" x2="480" y2="160" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect class="purple-outer" x="40" y="170" width="600" height="240" rx="20" stroke-width="0.5"/>
<text class="th purple-text" x="340" y="198" text-anchor="middle">Use case factory</text>
<text class="ts purple-sub" x="340" y="218" text-anchor="middle">Autonomous agent loop, resumable state</text>

<rect class="purple-step" x="70" y="240" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th purple-text" x="135" y="264" text-anchor="middle" dominant-baseline="central">Plan</text>
<text class="ts purple-sub" x="135" y="282" text-anchor="middle" dominant-baseline="central">Decompose work</text>

<rect class="purple-step" x="220" y="240" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th purple-text" x="285" y="264" text-anchor="middle" dominant-baseline="central">Execute</text>
<text class="ts purple-sub" x="285" y="282" text-anchor="middle" dominant-baseline="central">Tool calls, files</text>

<rect class="purple-step" x="370" y="240" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th purple-text" x="435" y="264" text-anchor="middle" dominant-baseline="central">Validate</text>
<text class="ts purple-sub" x="435" y="282" text-anchor="middle" dominant-baseline="central">Deterministic checks</text>

<rect class="purple-step" x="520" y="240" width="100" height="56" rx="8" stroke-width="0.5"/>
<text class="th purple-text" x="570" y="264" text-anchor="middle" dominant-baseline="central">Persist</text>
<text class="ts purple-sub" x="570" y="282" text-anchor="middle" dominant-baseline="central">state.json</text>

<line x1="200" y1="268" x2="216" y2="268" stroke="#3C3489" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="350" y1="268" x2="366" y2="268" stroke="#3C3489" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="500" y1="268" x2="516" y2="268" stroke="#3C3489" stroke-width="0.5" marker-end="url(#arrow)"/>

<path d="M 435 296 L 435 340 L 135 340 L 135 296" fill="none" stroke="#3C3489" stroke-width="0.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<text class="ts purple-sub" x="285" y="334" text-anchor="middle">retry on failure, max 3 attempts</text>

<text class="ts purple-sub" x="340" y="378" text-anchor="middle">8 sub-tasks: bootstrap → scenario → brief → schema → data → starter → solution → assembly</text>

<line x1="200" y1="410" x2="180" y2="450" stroke="#0F6E56" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="410" x2="340" y2="450" stroke="#0F6E56" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="480" y1="410" x2="500" y2="450" stroke="#0F6E56" stroke-width="0.5" marker-end="url(#arrow)"/>

<text class="ts" x="340" y="442" text-anchor="middle">Outputs · ready-to-ship recruitment package</text>

<rect class="teal-fill" x="40" y="460" width="180" height="80" rx="8" stroke-width="0.5"/>
<text class="th teal-text" x="130" y="486" text-anchor="middle" dominant-baseline="central">Candidate brief</text>
<text class="ts teal-sub" x="130" y="506" text-anchor="middle" dominant-baseline="central">Context, mission, KPIs</text>
<text class="ts teal-sub" x="130" y="522" text-anchor="middle" dominant-baseline="central">Inputs, criteria</text>

<rect class="teal-fill" x="250" y="460" width="180" height="80" rx="8" stroke-width="0.5"/>
<text class="th teal-text" x="340" y="486" text-anchor="middle" dominant-baseline="central">Starter project</text>
<text class="ts teal-sub" x="340" y="506" text-anchor="middle" dominant-baseline="central">PBIP · Notebook · SQL</text>
<text class="ts teal-sub" x="340" y="522" text-anchor="middle" dominant-baseline="central">Seeded sample data</text>

<rect class="teal-fill" x="460" y="460" width="180" height="80" rx="8" stroke-width="0.5"/>
<text class="th teal-text" x="550" y="486" text-anchor="middle" dominant-baseline="central">Recruiter solution</text>
<text class="ts teal-sub" x="550" y="506" text-anchor="middle" dominant-baseline="central">Rubric, debrief Qs</text>
<text class="ts teal-sub" x="550" y="522" text-anchor="middle" dominant-baseline="central">+ Python ground truth</text>

<text class="ts" x="340" y="572" text-anchor="middle">Each run varies the scenario · resumable from any failure point</text>

</svg>
