services:
  buc_factory:
    build: .
    image: buc-factory:latest
    container_name: buc-factory
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./conf:/app/conf
      - ./data:/app/data
      - ./log:/app/log
    depends_on:
      mlflow:
        condition: service_healthy
    # Run a specific assessment:
    #   docker compose run --rm buc_factory --config conf/industry_spec/p&c_insurance_france.yml --output-dir data/run_001

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.11.1
    container_name: mlflow
    ports:
      - "5001:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:////mlflow/mlflow.db
        --default-artifact-root /mlflow/artifacts
        --allowed-hosts "mlflow:5000,127.0.0.1:5001,localhost:5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000').read()"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mlflow_data:

# Useful commands:
#   docker compose up mlflow -d          # start MLflow server only
#   docker compose run --rm buc_factory --config conf/... --output-dir data/run_001
#   docker compose down --rmi all        # tear down everything
#   docker system prune -a               # full cleanup
