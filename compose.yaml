services:

  # ── API server (long-running) ───────────────────────────────────
  api:
    build: .
    image: ghcr.io/allantamdem/buc_factory:latest
    pull_policy: missing
    container_name: buc-factory-api
    command: [".venv/bin/buc-factory-api"]
    restart: unless-stopped
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8010:8000"
    volumes:
      - ./log:/app/log
      - ./data:/app/data
    depends_on:
      mlflow:
        condition: service_healthy

  # ── CLI one-shot runner (use docker compose run, not up) ────────
  buc_factory:
    image: ghcr.io/allantamdem/buc_factory:latest
    pull_policy: missing
    container_name: buc-factory
    profiles: ["cli"]
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./conf:/app/conf
      - ./data:/app/data
      - ./log:/app/log
    depends_on:
      mlflow:
        condition: service_healthy
    # Run a specific assessment:
    #   docker compose run --rm buc_factory --config conf/industry_spec/p&c_insurance_france.yml --output-dir data/run_001

  # ── Streamlit UI ───────────────────────────────────────────────
  ui:
    image: ghcr.io/allantamdem/buc_factory:latest
    pull_policy: missing
    container_name: buc-factory-ui
    environment:
      API_BASE_URL: "http://api:8000"
      API_PUBLIC_URL: "${API_PUBLIC_URL:-http://localhost:8010}"
    command:
      - .venv/bin/buc-factory-ui
      - --server.headless=true
      - --server.address=0.0.0.0
      - --server.port=8501
    restart: unless-stopped
    ports:
      - "8511:8501"
    depends_on:
      - api

  # ── MLflow tracking server ──────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.12.0
    container_name: mlflow
    restart: unless-stopped
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:5000,localhost:5011,127.0.0.1:5011"
    ports:
      - "5011:5000"
    volumes:
      - ./data/mlflow:/mlflow
    command:
      - sh
      - -c
      - >-
        mlflow server --host 0.0.0.0 --port 5000
        --backend-store-uri sqlite:////mlflow/mlflow.db
        --default-artifact-root /mlflow/artifacts
        --serve-artifacts
        --artifacts-destination /mlflow/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health').read()"]
      interval: 5s
      timeout: 3s
      retries: 10

# Useful commands:
#   docker compose up mlflow api ui -d   # start MLflow + API + UI
#   docker compose up mlflow -d          # start MLflow server only
#   docker compose --profile cli run --rm buc_factory --config conf/... --output-dir data/run_001
#   docker compose down --rmi all        # tear down everything
#   docker system prune -a               # full cleanup
