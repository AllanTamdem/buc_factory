[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buc-factory"
version = "0.1.0"
description = "An AI agent that generates role-specific data recruitment assessments from a single YAML config file."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
authors = [
    { name = "Alain TAMDEM", email = "allan.tamdem@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.97.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "langchain>=1.2.15",
    "langchain-anthropic>=1.4.1",
    "langchain-openai>=0.3.0",
    "langgraph>=1.0.0",
    "numpy>=1.26.0",
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "mlflow>=3.11.1",
    "uvicorn[standard]>=0.30.0",
    "aiofiles>=23.0.0",
    "streamlit>=1.40.0",
    "requests>=2.32.0",
]

[project.urls]
Repository = "https://github.com/AllanTamdem/buc_factory"
Documentation = "https://github.com/AllanTamdem/buc_factory#readme"

[project.scripts]
buc-factory-api = "buc_factory.app.api:run"
buc-factory-backfill = "buc_factory.app.backfill:backfill"
buc-factory-ui = "buc_factory.app.ui:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"buc_factory" = ["conf/*.yml", "static/*.svg"]
"buc_factory.agent.deliverables.powerbi" = ["*.yml"]
"buc_factory.agent.deliverables.notebook" = ["*.yml"]
"buc_factory.simulator" = ["*.yml"]
"buc_factory.simulator.powerbi" = ["*.yml"]
"buc_factory.simulator.notebook" = ["*.yml"]
"buc_factory.scorer.powerbi" = ["*.yml"]
"buc_factory.scorer.notebook" = ["*.yml"]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.20.1",
    "pandas-stubs>=3.0.0.260204",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "C4",
  "RET",
  "ARG",
]
fixable = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
